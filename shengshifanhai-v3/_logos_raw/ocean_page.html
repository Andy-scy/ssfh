              var src = _this.attr("src")//获取当前点击的pimg元素中的src属性

                var windowW = $(window).width()//获取当前窗口宽度
                var windowH = $(window).height()//获取当前窗口高度
                var realWidth = this.width//获取图片真实宽度
                var realHeight = this.height//获取图片真实高度
                var imgWidth, imgHeight
                var scale = 0.8//缩放尺寸，当图片真实宽度和高度大于窗口宽度和高度时进行缩放

                if (realHeight > windowH * scale) {//判断图片高度
                  imgHeight = windowH * scale//如大于窗口高度，图片高度进行缩放
                  imgWidth = imgHeight / realHeight * realWidth//等比例缩放宽度
                  if (imgWidth > windowW * scale) {//如宽度扔大于窗口宽度
                    imgWidth = windowW * scale//再对宽度进行缩放
                  }
                } else if (realWidth > windowW * scale) {//如图片高度合适，判断图片宽度
                  imgWidth = windowW * scale//如大于窗口宽度，图片宽度进行缩放
                  imgHeight = imgWidth / realWidth * realHeight//等比例缩放高度
                } else {//如果图片真实高度和宽度都符合要求，高宽不变
                  imgWidth = realWidth
                  imgHeight = realHeight
                }
                $(bigimg).css("width", imgWidth)//以最终的宽度对图片缩放

                var w = (windowW - imgWidth) / 2//计算图片与窗口左边距
                var h = (windowH - imgHeight) / 2//计算图片与窗口上边距
                $(innerdiv).css({ "top": h, "left": w })//设置#innerdiv的top和left属性
                $(outerdiv).fadeIn("fast")//淡入显示#outerdiv及.pimg
              })

              $(outerdiv).click(function () {//再次点击淡出消失弹出层
                $(this).fadeOut("fast")
              })
            }

                  imgHeight = windowH * scale//如大于窗口高度，图片高度进行缩放
                  imgWidth = imgHeight / realHeight * realWidth//等比例缩放宽度
                  if (imgWidth > windowW * scale) {//如宽度扔大于窗口宽度
                    imgWidth = windowW * scale//再对宽度进行缩放
                  }
                } else if (realWidth > windowW * scale) {//如图片高度合适，判断图片宽度
                  imgWidth = windowW * scale//如大于窗口宽度，图片宽度进行缩放
                  imgHeight = imgWidth / realWidth * realHeight//等比例缩放高度
                } else {//如果图片真实高度和宽度都符合要求，高宽不变
                  imgWidth = realWidth
                  imgHeight = realHeight
                }
                $(bigimg).css("width", imgWidth)//以最终的宽度对图片缩放

                var w = (windowW - imgWidth) / 2//计算图片与窗口左边距
                var h = (windowH - imgHeight) / 2//计算图片与窗口上边距
                $(innerdiv).css({ "top": h, "left": w })//设置#innerdiv的top和left属性
                $(outerdiv).fadeIn("fast")//淡入显示#outerdiv及.pimg
              })

              $(outerdiv).click(function () {//再次点击淡出消失弹出层
                $(this).fadeOut("fast")
              })
            }

            var timmerHandle = null
            var isDrag = false
            $(".imgClickMobile").mousedown(function (e) {
              //因为mouseDownFun每次都会调用的，在这里重新初始化这个变量
              isDrag = false
              timmerHandle = setTimeout(setDragTrue, 100)
            })
            window.onload = function () {
              $(".imgClickMobile").mouseup(function (e) {
                if (isDrag) {
                  clearTimeout(timmerHandle)
                } else {
                  $('.imgClickMobile').on('click', function (e) {
                    if (!isDrag) {
                      mySwiper3.autoplay.stop()
                      isAuto = false
                      var _this = $(e.currentTarget.children[1])//将当前的pimg元素作为_this传入函数
                      imgShow("#outerdiv", "#innerdiv", "#bigimg", _this)
                      $('.imgClickMobile').unbind('click')
                    }

                  })
                  clearTimeout(timmerHandle)
                }
              })
            }

            function setDragTrue () {
              isDrag = true
            }

            $('.pc-container .arrow-left').on('click', function (e) {
              mySwiper3.autoplay.stop()
              e.preventDefault()
              mySwiper3.slidePrev()
            })
            $('.pc-container .arrow-right').on('click', function (e) {

              mySwiper3.autoplay.stop()
              e.preventDefault()
              mySwiper3.slideNext()
            })
            $('.no_video').hover(function (e) {
              mySwiper3.autoplay.stop()
              isAuto = false
            }, function () {
              mySwiper3.autoplay.start()
              isAuto = true
            })
            $('.ban_video').hover(function (e) {
              mySwiper3.autoplay.stop()
              isAuto = false
            }, function () {
              mySwiper3.autoplay.start()
              isAuto = true
            })
            $('.index-banner .pagination,.pc-container .arrow-left,.pc-container .arrow-right').hover(function (e) {
              mySwiper3.autoplay.stop()
              isAuto = false
            }, function () {
              mySwiper3.autoplay.start()
              isAuto = true
            })

          }


        }
      })
  }

  // 获取公司新闻以及媒体公告数据
  function getNewsData (newstype) {
    getAjax('News/GetNewsLst', 'POST', {
      "Data": {
        "LanguageType": 1,
        "Title": "",
        "PublishYear": "",
        "Type": newstype
      },
      "PageIndex": 1,
      "PageSize": 6
    }, '',
      function (res) {
        if (res.data.length > 0) {
          $("#item-more-newdata").show()
          $("#item-more-mediareport").show()
          var imgDataListCode = ""
          for (var i = 0; i < res.data.length; i++) {
            var entity = res.data[i]
            imgDataListCode += '<li>'
            if (newstype == 1) {
              imgDataListCode += ' <a href="News/detail.html?id=' + entity.code + '" target="_blank" title="' + entity.title + '">'
            } else {
              imgDataListCode += ' <a href="News/detail-medioreport.html?id=' + entity.code + '" target="_blank" title="' + entity.title + '">'
            }

            imgDataListCode += ' <p>' + entity.title + '</p>'
            imgDataListCode += ' <span>' + dateFormat(entity.publishDate.toString(), 3) + '</span>'
            imgDataListCode += ' </a></li>'
          }
          if (newstype == 1) {
            $("#companyNewsData").html(imgDataListCode)
          } else if (newstype == 2) {
            $("#meidiReportData").html(imgDataListCode)
          }
        } else {
          $("#item-more-newdata").hide()
          $("#item-more-mediareport").hide()
        }
      }, '',
      function (res) {
        $("#item-more-newdata").hide()
        $("#item-more-mediareport").hide()
      })
  }
